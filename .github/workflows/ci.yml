name: ROS2 CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Build Docker Image
      run: |
        docker build -t ros2_ci_image .

    - name: Run Build and Test inside Docker
      run: |
        docker run --rm ros2_ci_image bash -c "source /opt/ros/humble/setup.bash && colcon build"
